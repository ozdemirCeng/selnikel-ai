name: Selnikel AI — Enterprise CI & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: 🛡️ Gitleaks & Repository Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Action (Strict Blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run High Entropy & Credential Scanner
        run: |
          python backend/scripts/scan_secrets.py

      - name: Upload Security Scan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: security_scan_results.json
          if-no-files-found: ignore

  backend-tests:
    name: 🐍 Backend Tests & PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: selnikel_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "nc -z localhost 6333 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          pip install "pyjwt[crypto]==2.10.1"

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/selnikel_ai
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/selnikel_ai
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          AUTH_MODE: development
          REQUIRE_POSTGRES_MIGRATION: "true"
          REQUIRE_POSTGRES_QUEUE: "true"
        run: |
          cd backend
          pytest -v --tb=short

  frontend-build:
    name: ⚛️ Frontend Build & Asset Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for Smoke Testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck & Build Next.js
        run: |
          cd frontend
          npm run build

      - name: Install Python Test HTTP Dependencies
        run: |
          pip install pytest pytest-asyncio httpx

      - name: Run Live Server and Verify Asset Bundles
        env:
          REQUIRE_LIVE_FRONTEND: "true"
        run: |
          cd frontend
          npm run start -- -p 3005 &
          sleep 4
          cd ..
          pytest backend/tests/test_frontend_assets_smoke.py -v
