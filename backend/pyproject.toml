[project]
name = "selnikel-ai-backend"
version = "0.1.0"
description = "Internal AI Engineering Knowledge System Backend for Selnikel Enerji"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.10.0,<2.0.0",
    "openai>=1.40.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.10.1",
    "cryptography>=43.0.0",
    "pypdf>=4.3.0",
    "flashrank>=0.2.10",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
